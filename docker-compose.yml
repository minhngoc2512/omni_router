# OmniRoute — https://github.com/diegosouzapw/OmniRoute
# All configuration lives in .env (same directory).
#
#   docker compose up -d          # start
#   docker compose logs -f        # follow logs
#   ./update.sh                   # update the image (backup → pull → up -d)

x-logging: &logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  omniroute:
    image: diegosouzapw/omniroute:${OMNIROUTE_IMAGE_TAG:-latest}
    container_name: omniroute
    restart: unless-stopped
    # Run as the host user that owns data/ and logs/ (set by setup.sh; the image default is 1000)
    user: "${PUID:-1000}:${PGID:-1000}"
    # Give SQLite (WAL) enough time to checkpoint when the container stops
    stop_grace_period: 40s
    env_file: .env
    environment:
      # Values that must match the volume mounts below
      DATA_DIR: /app/data
      APP_LOG_FILE_PATH: ${APP_LOG_FILE_PATH:-/app/logs/app.log}
      HOSTNAME: 0.0.0.0
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-20128}:${PORT:-20128}"
      - "${BIND_ADDRESS:-127.0.0.1}:${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}"
    volumes:
      - ${DATA_PATH:-./data}:/app/data
      - ${LOG_PATH:-./logs}:/app/logs
    mem_limit: ${CONTAINER_MEM_LIMIT:-3g}
    depends_on:
      redis:
        condition: service_healthy
    # Healthcheck is built into the image (node healthcheck.mjs → /healthz)
    logging: *logging

  redis:
    image: redis:8-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    # Run as the host user's uid so ./redis stays writable and keeps its ownership
    user: "${PUID:-1000}:${PGID:-1000}"
    command: redis-server --save 60 1 --loglevel warning
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${REDIS_DATA_PATH:-./redis}:/data
    # No published port: only omniroute reaches it over the internal compose network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *logging
